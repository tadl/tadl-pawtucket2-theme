name: Theme checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install PHP 8.3 test extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-xml php8.3-mbstring php8.3-sqlite3
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
          python3 --version
      - name: Syntax and whitespace
        run: |
          git ls-files -z '*.php' | xargs -0 -n 1 php -l
          for script_file in assets/pawtucket/js/*.js; do node --check "$script_file"; done
          bash -n support/deploy-theme.sh
          git diff-tree --check HEAD
      - name: Standalone regressions
        run: |
          for test_file in tests/*_test.php; do php "$test_file" || exit 1; done
