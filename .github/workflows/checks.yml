name: Theme checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install PHP 8.3 test extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-xml php8.3-mbstring php8.3-sqlite3
          sudo update-alternatives --set php /usr/bin/php8.3
          php --version
          python3 --version
      - name: Syntax and whitespace
        run: |
          git ls-files -z '*.php' | xargs -0 -n 1 php -l
          for script_file in assets/pawtucket/js/*.js; do node --check "$script_file"; done
          bash -n support/deploy-theme.sh
          git diff-tree --check HEAD
      - name: Standalone regressions
        run: |
          for test_file in tests/*_test.php; do php "$test_file" || exit 1; done
      - name: Prepare isolated accessibility browser tools
        run: |
          browser_tools=$(mktemp -d)
          npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1 axe-core@4.14.0
          "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          browser_reference="$RUNNER_TEMP/pawtucket2-reference"
          git clone --filter=blob:none --sparse --depth=1 --branch 2.0.10 https://github.com/collectiveaccess/pawtucket2.git "$browser_reference"
          test "$(git -C "$browser_reference" rev-parse HEAD)" = 3d4fac153fa623c0ed93907500377aeb37666c10
          git -C "$browser_reference" sparse-checkout set assets/bootstrap assets/jquery assets/ca assets/fontawesome
          echo "NODE_PATH=$browser_tools/node_modules" >> "$GITHUB_ENV"
          echo "TADL_REFERENCE_ROOT=$browser_reference" >> "$GITHUB_ENV"
      - name: Accessibility browser regressions
        run: node tests/accessibility_browser_test.js
      - name: Thumbnail grid browser regressions
        run: node tests/thumbnail_grid_browser_test.js
