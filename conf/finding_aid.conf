# Public descriptive metadata, applied independently at every hierarchy level.
# Missing, empty and unreadable bundles are omitted. Never enumerate all fields:
# internal notes, preservation identifiers and other staff data stay excluded.
# Reuse PDF bytes via the configured native cache (Redis/file/etc.), at most one day.
# Current access and descriptive data are rebuilt first; changed data produces a new key.
# Set to 0 to always regenerate. No page HTML or permission decisions are persisted.
pdf_cache_timeout = 86400
enabled = 1
hierarchy_sort = rank

collection_fields = {
	repository = { label = Holding repository, bundles = [ca_collections.repository] },
	level = { label = Level of description, bundles = [ca_collections.type_id] },
	creators = { label = Creators, related_table = ca_entities, relationship_types = [creator], bundles = [ca_entities.preferred_labels.displayname] },
	dates = { label = Dates, bundles = [ca_collections.date.dates_value, ca_collections.unitdate.dates_value, ca_collections.unitdate.date_value] },
	extent = { label = Extent, bundles = [ca_collections.extent_text, ca_collections.extent] },
	# Match collection-detail labels for the selected language List attribute.
	# Set display_language_labels = 0 to also filter the language terms by access.
	language = { label = Language, display_language_labels = 1, bundles = [ca_collections.language, ca_collections.langmaterial] },
	abstract = { label = Abstract, bundles = [ca_collections.abstract] },
	description = { label = Description, bundles = [ca_collections.description] },
	description_source = { label = Source of description, bundles = [ca_collections.description_source] },
	history = { label = Administrative or biographical history, bundles = [ca_collections.adminbiohist] },
	scope = { label = Scope and content, bundles = [ca_collections.collection_scope_content, ca_collections.scopecontent] },
	arrangement = { label = Arrangement, bundles = [ca_collections.arrangement] },
	provenance = { label = Provenance, bundles = [ca_collections.provenance, ca_collections.custodhist, ca_collections.custohist] },
	acquisition = { label = Acquisition, bundles = [ca_collections.acqinfo] },
	accruals = { label = Accruals, bundles = [ca_collections.accruals] },
	access_conditions = { label = Conditions governing access, bundles = [ca_collections.accessrestrict] },
	physical_access = { label = Physical access, bundles = [ca_collections.physaccessrestrict] },
	technical_access = { label = Technical access, bundles = [ca_collections.techaccessrestrict] },
	rights = { label = Rights, bundles = [ca_collections.rights.rightsText] },
	copyright = { label = Copyright statement, bundles = [ca_collections.rights.copyrightStatement] },
	reproduction = { label = Conditions governing reproduction, bundles = [ca_collections.reproduction] },
	subjects = { label = Subjects, bundles = [ca_collections.lcsh_terms] },
	originals = { label = Location of originals, bundles = [ca_collections.originalsloc] },
	copies = { label = Copies and digital availability, bundles = [ca_collections.altformavail] },
	related_material = { label = Related archival materials, bundles = [ca_collections.relatedmaterial] },
	related_links = { label = Related links, bundles = [ca_collections.external_link.url_line2.url_entry] },
	other_finding_aids = { label = Other finding aids, bundles = [ca_collections.otherfindingaid] },
	processing = { label = Processing information, bundles = [ca_collections.processInfo, ca_collections.processinfo] },
	citation = { label = Preferred citation, bundles = [ca_collections.preferCite] }
}
