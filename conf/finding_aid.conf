# Initial public finding aid. Archives staff can refine these field mappings.
enabled = 1

collection_fields = {
	description = { label = Description, bundles = [ca_collections.description] },
	dates = { label = Dates, bundles = [ca_collections.date.dates_value] },
	extent = { label = Extent, bundles = [ca_collections.extent_text, ca_collections.extent] },
	scope = { label = Scope and content, bundles = [ca_collections.collection_scope_content] },
	language = { label = Language, bundles = [ca_collections.language] },
	rights = { label = Rights, bundles = [ca_collections.rights.rightsText] }
}

# idno is the catalog identifier; do not assume a legacy number is the same field.
inventory_fields = {
	identifier = { label = Identifier / accession number, bundles = [ca_objects.idno] },
	legacy_identifier = { label = Legacy accession number, bundles = [ca_objects.legacy_accession_number] },
	dates = { label = Dates, bundles = [ca_objects.date.dates_value] }
}

# Show a readable home storage location, otherwise readable related storage
# locations. These are recorded locations, not a claim about the current location.
include_storage_locations = 1
