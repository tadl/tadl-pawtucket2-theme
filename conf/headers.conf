# Preserve native security headers; override only the two script policies.
# Use scalar policies so the old restrictive CSP is replaced, not appended.
#!merge
security = {
	Content-Security-Policy = "script-src 'self' maps.googleapis.com cdn.knightlab.com nominatim.openstreetmap.org ajax.googleapis.com tagmanager.google.com www.googletagmanager.com www.google-analytics.com www.google.com/recaptcha/ www.gstatic.com platform-api.sharethis.com buttons-config.sharethis.com https://challenges.cloudflare.com 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';",
	X-Content-Security-Policy = "script-src 'self' maps.googleapis.com cdn.knightlab.com nominatim.openstreetmap.org ajax.googleapis.com tagmanager.google.com www.googletagmanager.com www.google-analytics.com www.google.com/recaptcha/ www.gstatic.com platform-api.sharethis.com buttons-config.sharethis.com https://challenges.cloudflare.com 'unsafe-inline' 'unsafe-eval';"
}
