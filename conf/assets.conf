# Theme-specific asset (js, css) configuration
 
 
minification = 0

themePackages = {
	# -----------------------
	pawtucket = {
		css = css/main.css:100, 
		fonts = css/fonts.css,
		themecss = css/theme.css:200,
		errorcss = css/error.css:210,
		accessibility = css/accessibility.css:250,
		imageDownloads = js/image-downloads.js,
		userFeatures = js/user-features.js,
		lightboxOrder = js/lightbox-order.js,
		thumbnailFocus = js/thumbnail-focus.js,
		recentWriting = js/recent-writing.js
	}
	# -----------------------
}

themeLoadSets = {
	#
	# Libraries listed in "_default" are always loaded (whether or not they have been
	# registered in code to load), are loaded in the order listed and are always 
	# loaded first
	#
	_default = [
		pawtucket/css, pawtucket/fonts, pawtucket/themecss, pawtucket/accessibility, pawtucket/imageDownloads, pawtucket/userFeatures, pawtucket/lightboxOrder, pawtucket/thumbnailFocus, pawtucket/recentWriting
	]
}
